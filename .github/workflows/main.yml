name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: code-by-nusrat
          outputs: |
            dist/snake.svg

      - name: Push snake to snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_branch: snake-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
